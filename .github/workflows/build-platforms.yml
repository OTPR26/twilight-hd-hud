name: Build platform packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out HUD source
        uses: actions/checkout@v4

      - name: Check out compatible Dusklight source
        uses: actions/checkout@v4
        with:
          repository: TwilitRealm/dusklight
          ref: edf42c6a7202647b56dd2fcdef02d17671bc814b
          submodules: recursive
          path: dusklight

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDUSK_DIR="${GITHUB_WORKSPACE}/dusklight"
          -DTWILIGHT_HUD_BUILD_TESTS=ON

      - name: Build package
        run: cmake --build build

      - name: Run HUD regression tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify font checksums
        run: python3 tests/font_manifest_test.py
      - name: Check Collection artwork
        run: python3 tests/collection_art_test.py

      - name: Check HUD and map draw scopes
        run: |
          python3 tests/action_text_structure_test.py
          python3 tests/dialogue_text_structure_test.py
          python3 tests/playstation_colors_test.py
          python3 tests/third_slot_interactions_test.py
          python3 tests/item_bank_structure_test.py
          python3 tests/dungeon_map_structure_test.py
          python3 tests/overworld_map_structure_test.py
          python3 tests/rupee_minimap_structure_test.py
          python3 tests/map_responsive_structure_test.py
          python3 tests/menu_input_structure_test.py
          python3 tests/optional_features_structure_test.py
          python3 tests/language_layout_structure_test.py
          python3 tests/touch_hook_structure_test.py
          python3 tests/quick_transform_structure_test.py
          python3 tests/file_select_structure_test.py
          python3 tests/update_service_structure_test.py
          python3 tests/meter_center_structure_test.py
          python3 tests/option_confirmation_structure_test.py
          python3 tests/options_presentation_structure_test.py
          python3 tests/fish_journal_structure_test.py
          python3 tests/fish_journal_input_test.py
          python3 tests/warp_map_details_structure_test.py
          python3 tests/collection_screen_structure_test.py
          python3 tests/golden_bugs_structure_test.py
          python3 tests/hidden_skills_structure_test.py
          python3 tests/letters_structure_test.py
          python3 tests/apple_texture_package_test.py

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: twilight-hd-hud-linux-${{ matrix.arch }}
          path: build/mods/twilight_hd_hud.dusk
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            msvc_arch: amd64
            sdk_arch: amd64
          - arch: arm64
            msvc_arch: amd64_arm64
            sdk_arch: arm64
    steps:
      - name: Check out HUD source
        uses: actions/checkout@v4

      - name: Check out compatible Dusklight source
        uses: actions/checkout@v4
        with:
          repository: TwilitRealm/dusklight
          ref: edf42c6a7202647b56dd2fcdef02d17671bc814b
          submodules: recursive
          path: dusklight

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Download Nightly 402 Windows SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35071586760 --repo TwilitRealm/dusklight -n dusklight-v1.4.1-402-win32-msvc-${{ matrix.arch }} -D host-sdk

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDUSK_DIR="$env:GITHUB_WORKSPACE/dusklight"
          -DDUSK_GAME_EXE="$env:GITHUB_WORKSPACE/host-sdk/sdk/windows-${{ matrix.sdk_arch }}.lib"

      - name: Build package
        run: cmake --build build

      - name: Verify Windows DLL architecture
        run: python tests/windows_package_test.py build/mods/twilight_hd_hud.dusk ${{ matrix.sdk_arch }}

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: twilight-hd-hud-windows-${{ matrix.arch }}
          path: build/mods/twilight_hd_hud.dusk
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-latest
    steps:
      - name: Check out HUD source
        uses: actions/checkout@v4

      - name: Check out compatible Dusklight source
        uses: actions/checkout@v4
        with:
          repository: TwilitRealm/dusklight
          ref: edf42c6a7202647b56dd2fcdef02d17671bc814b
          submodules: recursive
          path: dusklight

      - name: Install build tools
        run: brew install cmake ninja

      - name: Download macOS link stub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build-stubs
          gh run download 35071586760 --repo TwilitRealm/dusklight -n dusklight-v1.4.1-402-macos-appleclang-${{ matrix.arch }} -D host-sdk
          cp host-sdk/sdk/stub-macos-${{ matrix.arch }} build-stubs/stub-macos-${{ matrix.arch }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDUSK_DIR="${GITHUB_WORKSPACE}/dusklight"
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DDUSK_GAME_EXE="${GITHUB_WORKSPACE}/build-stubs/stub-macos-${{ matrix.arch }}"

      - name: Build package
        run: cmake --build build

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: twilight-hd-hud-macos-${{ matrix.arch }}
          path: build/mods/twilight_hd_hud.dusk
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out HUD source
        uses: actions/checkout@v4

      - name: Check out compatible Dusklight source
        uses: actions/checkout@v4
        with:
          repository: TwilitRealm/dusklight
          ref: edf42c6a7202647b56dd2fcdef02d17671bc814b
          submodules: recursive
          path: dusklight

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Download Android link stub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build-stubs
          gh run download 35071586760 --repo TwilitRealm/dusklight -n dusklight-v1.4.1-402-android-arm64 -D host-sdk
          cp host-sdk/sdk/stub-android-aarch64.so build-stubs/stub-android-aarch64.so

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDUSK_DIR="${GITHUB_WORKSPACE}/dusklight"
          -DCMAKE_TOOLCHAIN_FILE="${ANDROID_SDK_ROOT}/ndk/28.2.13676358/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-28
          -DDUSK_GAME_EXE="${GITHUB_WORKSPACE}/build-stubs/stub-android-aarch64.so"

      - name: Build package
        run: cmake --build build

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: twilight-hd-hud-android-aarch64
          path: build/mods/twilight_hd_hud.dusk
          if-no-files-found: error

  desktop-package:
    name: Combine desktop and Android package
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine native modules
        shell: bash
        run: |
          mkdir -p package modules
          unzip -q artifacts/twilight-hd-hud-linux-x86_64/twilight_hd_hud.dusk \
            -d package
          for platform in \
            twilight-hd-hud-windows-x86_64 \
            twilight-hd-hud-windows-arm64 \
            twilight-hd-hud-linux-aarch64 \
            twilight-hd-hud-macos-x86_64 \
            twilight-hd-hud-macos-arm64 \
            twilight-hd-hud-android-aarch64
          do
            rm -rf modules/*
            unzip -q "artifacts/${platform}/twilight_hd_hud.dusk" -d modules
            cp -R modules/lib/. package/lib/
          done
          (cd package && zip -q -r ../Twilight-HD-HUD-Desktop-Android.dusk .)

      - name: Verify desktop and Android modules
        shell: bash
        run: |
          unzip -l Twilight-HD-HUD-Desktop-Android.dusk | grep 'lib/linux-x86_64/mod.so'
          unzip -l Twilight-HD-HUD-Desktop-Android.dusk | grep 'lib/windows-amd64/mod.dll'
          unzip -l Twilight-HD-HUD-Desktop-Android.dusk | grep 'lib/windows-arm64/mod.dll'
          unzip -l Twilight-HD-HUD-Desktop-Android.dusk | grep 'lib/macos-arm64/mod.so'
          unzip -l Twilight-HD-HUD-Desktop-Android.dusk | grep 'lib/android-aarch64/mod.so'

      - name: Upload desktop and Android package
        uses: actions/upload-artifact@v4
        with:
          name: twilight-hd-hud-desktop-android
          path: Twilight-HD-HUD-Desktop-Android.dusk
          if-no-files-found: error

  apple-mobile:
    name: Build iOS and tvOS
    runs-on: macos-latest
    steps:
      - name: Check out HUD source
        uses: actions/checkout@v4

      - name: Check out compatible Dusklight source
        uses: actions/checkout@v4
        with:
          repository: TwilitRealm/dusklight
          ref: edf42c6a7202647b56dd2fcdef02d17671bc814b
          submodules: recursive
          path: dusklight

      - name: Install build tools
        run: brew install cmake ninja

      - name: Prepare Apple link stubs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build-stubs
          gh run download 35071586760 --repo TwilitRealm/dusklight -n dusklight-v1.4.1-402-ios-appleclang-arm64 -D host-sdk
          cp host-sdk/sdk/stub-ios-arm64 build-stubs/stub-ios-arm64
          curl -L --fail --output build-stubs/symgen \
            https://github.com/encounter/symgen/releases/download/v1.3.2/symgen-macos-arm64
          chmod +x build-stubs/symgen
          build-stubs/symgen stub \
            --out build-stubs/stub-tvos-arm64 \
            --format macho \
            --platform tvos \
            --min-os 14.5 \
            --arch arm64 \
            <(nm -jU build-stubs/stub-ios-arm64)

      - name: Configure iOS
        run: >
          cmake -S . -B build-ios -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDUSK_DIR="${GITHUB_WORKSPACE}/dusklight"
          -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/dusklight/ios.toolchain.cmake"
          -DPLATFORM=OS64
          -DDEPLOYMENT_TARGET=14.0
          -DENABLE_BITCODE=OFF
          -DENABLE_ARC=OFF
          -DENABLE_VISIBILITY=ON
          -DDUSK_GAME_EXE="${GITHUB_WORKSPACE}/build-stubs/stub-ios-arm64"

      - name: Build iOS
        run: cmake --build build-ios

      - name: Configure tvOS
        run: >
          cmake -S . -B build-tvos -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDUSK_DIR="${GITHUB_WORKSPACE}/dusklight"
          -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/dusklight/ios.toolchain.cmake"
          -DPLATFORM=TVOS
          -DDEPLOYMENT_TARGET=14.5
          -DENABLE_BITCODE=OFF
          -DENABLE_ARC=OFF
          -DENABLE_VISIBILITY=ON
          -DDUSK_GAME_EXE="${GITHUB_WORKSPACE}/build-stubs/stub-tvos-arm64"

      - name: Build tvOS
        run: cmake --build build-tvos

      - name: Combine Apple package
        shell: bash
        run: |
          mkdir -p build-apple-package
          ditto -x -k build-ios/mods/twilight_hd_hud.dusk build-apple-package
          mkdir -p build-apple-package/lib/tvos-arm64
          cp build-tvos/twilight_hd_hud_stage/lib/tvos-arm64/mod.so \
            build-apple-package/lib/tvos-arm64/mod.so
          cd build-apple-package
          zip -q -r ../Twilight-HD-HUD-iOS-tvOS.dusk .

      - name: Verify Apple modules
        shell: bash
        run: |
          unzip -l Twilight-HD-HUD-iOS-tvOS.dusk | grep 'lib/ios-arm64/mod.so'
          unzip -l Twilight-HD-HUD-iOS-tvOS.dusk | grep 'lib/tvos-arm64/mod.so'
          rm -rf verify-apple-textures
          mkdir verify-apple-textures
          unzip -q Twilight-HD-HUD-iOS-tvOS.dusk 'textures/*.dds' -d verify-apple-textures
          while IFS= read -r texture; do
            test "$(od -An -tu4 -j128 -N4 "$texture" | tr -d ' ')" = '28'
          done < <(find verify-apple-textures/textures -type f -name '*.dds')

      - name: Upload iOS and tvOS package
        uses: actions/upload-artifact@v4
        with:
          name: twilight-hd-hud-ios-tvos
          path: Twilight-HD-HUD-iOS-tvOS.dusk
          if-no-files-found: error

  universal-package:
    name: Combine all supported platforms
    needs: [desktop-package, apple-mobile]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: twilight-hd-hud-desktop-android
          path: dist/desktop
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: twilight-hd-hud-ios-tvos
          path: dist/apple
          merge-multiple: true
      - name: Install metadata verifier
        run: |
          curl -L --fail -o symgen https://github.com/encounter/symgen/releases/download/v1.3.2/symgen-linux-x86_64
          chmod +x symgen
      - name: Merge and verify metadata
        run: |
          python3 tools/merge_mod.py --symgen ./symgen -o Twilight-HD-HUD.dusk \
            --platform windows-amd64 --platform windows-arm64 \
            --platform linux-x86_64 --platform linux-aarch64 \
            --platform macos-arm64 --platform macos-x86_64 \
            --platform android-aarch64 --platform ios-arm64 dist/*/*.dusk
          python3 tools/merge_mod.py --symgen ./symgen -o Twilight-HD-HUD-tvOS.dusk \
            --platform tvos-arm64 dist/apple/*.dusk
      - name: Verify complete package
        run: |
          python3 tests/universal_package_test.py Twilight-HD-HUD.dusk
          python3 tests/universal_package_test.py Twilight-HD-HUD-tvOS.dusk --tvos
      - uses: actions/upload-artifact@v4
        with:
          name: twilight-hd-hud-universal
          path: Twilight-HD-HUD.dusk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: twilight-hd-hud-tvos
          path: Twilight-HD-HUD-tvOS.dusk
          if-no-files-found: error
